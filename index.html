<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8b934">
<title>POKÉMON TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--yellow:#f6cb45;--sun:#ffdf70;--red:#d94a3b;--blue:#314d79;--cream:#fff0bd;--brown:#55351f;--dark:#19151a;--screen:#080a0d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--cream);font:16px "Trebuchet MS",Arial,sans-serif;background:radial-gradient(ellipse at 50% 12%,#795b31 0,#383020 44%,#171923 100%)}
h1{margin:0;color:#ffdf45;font-family:"Luckiest Guy","Arial Rounded MT Bold",sans-serif;font-size:clamp(2rem,7vw,4.4rem);font-weight:400;letter-spacing:.07em;-webkit-text-stroke:2px #28528a;paint-order:stroke fill;text-shadow:3px 4px 0 #1d3760,5px 7px 0 #a63631,0 0 18px #ffcf5a88}
.tv{position:relative;width:min(1000px,100%);padding:24px 26px 18px;margin-top:30px;border:5px solid #6b481e;border-radius:34px;background:linear-gradient(145deg,#ffe176 0%,#edbd3e 35%,#d99b2b 100%);box-shadow:inset 0 0 0 4px #fff0a5,inset 0 0 18px #fff5c155,0 22px 55px #000b}
.tv:before,.tv:after{content:"";position:absolute;top:-50px;width:5px;height:62px;border-radius:5px;background:linear-gradient(90deg,#aaa,#f3f0d7,#898989);transform-origin:bottom;box-shadow:1px 2px 3px #0008}.tv:before{left:44%;transform:rotate(-25deg)}.tv:after{left:54%;transform:rotate(25deg)}
.tvbadge{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);z-index:2;padding:5px 18px;border:3px solid #704824;border-radius:999px;background:linear-gradient(#fff0bd,#ddb964);color:#55351f;font-family:"Luckiest Guy","Arial Rounded MT Bold",sans-serif;font-size:.95rem;letter-spacing:.13em;white-space:nowrap;box-shadow:0 3px 0 #5c3a20}
.screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:12px solid #27242a;border-radius:44px/34px;background:var(--screen);box-shadow:inset 0 0 0 3px #55515a,0 0 0 5px #714c24,0 0 0 8px #f4d15b,0 12px 20px #0008}
.screen:after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000026 3px 4px),radial-gradient(ellipse at center,#0000 53%,#000a 100%)}
#vid,#ytbox,#embedbox{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}#vid{object-fit:contain}#ytplayer,#ytplayer iframe{width:100%;height:100%;border:0}#embedbox{z-index:1}
.empty,.power{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center}.empty{color:#f6d87c;font-weight:bold}.power{z-index:4;background:#08090bef}.power button{border:3px solid #682e29;border-radius:999px;padding:15px 26px;background:radial-gradient(circle at 35% 25%,#ff7662,#c72e31 72%);color:white;font:700 1rem "Trebuchet MS",Arial,sans-serif;box-shadow:0 0 24px #ef403d77,0 5px 0 #6b2925}
.osd{position:absolute;z-index:4;top:14px;left:16px;max-width:90%;color:#ffe66d;font-weight:bold;text-shadow:2px 2px #111,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .3s}.osd.on{opacity:1}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:21px;padding:13px 15px;border:3px solid #6b481e;border-radius:17px;background:linear-gradient(#f7d45b,#dda933);box-shadow:inset 0 2px 5px #fff7a1,0 7px 0 #71491f,0 12px 18px #0006}.sp{flex:1}
button,.btn{padding:9px 12px;border:2px solid #735022;border-radius:10px;background:linear-gradient(#fff2c4,#dfc27c);color:#51351e;font:700 .82rem "Trebuchet MS",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 0 #8e6532}button:hover,.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:none}#gear{display:none!important}input[type=range]{width:90px;accent-color:#c63d39}
.cols{display:none;width:min(1000px,100%);grid-template-columns:1fr 1fr;gap:14px}.cols.open{display:grid}.card{padding:16px;border:3px solid #6b481e;border-radius:16px;background:linear-gradient(145deg,#fff1bf,#e9cc83);color:#55351f;box-shadow:5px 6px 0 #0007}.card h2{margin:0 0 10px;color:#a34132;font-size:.9rem;letter-spacing:.13em;text-transform:uppercase}ol{margin:0;padding:0;max-height:320px;overflow:auto;list-style:none}li{display:flex;align-items:center;gap:8px;padding:7px;border-radius:8px;cursor:pointer}li:hover{background:#71501c17}li.now{background:#d64a3930;color:#a12e29}li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li em{font-size:.7rem;font-style:normal;color:#71501c}li button{padding:3px 8px}
input[type=text]{width:100%;margin-bottom:8px;padding:10px;border:2px solid #8a6532;border-radius:9px;background:#fff9e7;color:#3d2c20;font:inherit}.row{display:flex;gap:8px;margin-bottom:8px}.row input{margin:0}.filelabel{display:inline-block}.note{font-size:.78rem;line-height:1.5;color:#654924}
@media(max-width:650px){body{padding:14px 9px}.tv{margin-top:14px;padding:14px 13px 13px;border-radius:23px}.tv:before,.tv:after{display:none}.screen{border-width:7px;border-radius:26px/20px}.cols.open{grid-template-columns:1fr}.bar{padding:9px;gap:7px}.row{flex-wrap:wrap}.tvbadge{bottom:-14px}}
.screen:fullscreen{border:0;border-radius:0;box-shadow:none}.screen:fullscreen:after{border-radius:0}
</style>
</head>
<body>
<h1>POKÉMON TV</h1>
<div class="tv"><div class="screen" id="screen"><video id="vid" playsinline controls></video><div id="ytbox"><div id="ytplayer"></div></div><iframe id="embedbox" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen title="Vídeo incrustado"></iframe><div class="empty" id="empty">Canal Pokémon<br>Listo para sintonizar 📺</div><div class="osd" id="osd"></div><div class="power" id="power"><button id="powerBtn">⏻ Encender POKÉMON TV</button></div></div><div class="tvbadge">POKÉMON TV</div>
<div class="bar"><button id="play">⏯ Play</button><button id="prev">⏮ Anterior</button><button id="next">⏭ Siguiente</button><button id="off">⏻ Apagar</button><span class="sp"></span><button id="gear" title="Gestionar canal">⚙ Canal</button><button id="mute">🔊</button><input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen"><button id="full">⛶ Pantalla completa</button><button id="lang">🗣️ ES</button></div></div>
<div class="cols" id="manage"><section class="card"><h2>Programación</h2><ol id="list"></ol></section><section class="card"><h2>Añadir al canal</h2><input id="title" type="text" placeholder="Título (opcional)"><input id="mins" type="text" placeholder="Duración en minutos para vídeos incrustados"><div class="row"><input id="url" type="text" placeholder="Enlace de YouTube o vídeo"><button id="addUrl">Añadir</button></div><div class="row"><label class="btn filelabel">📁 Añadir archivos propios <input id="files" type="file" accept="video/*" multiple hidden></label><button id="clear">🗑 Vaciar canal</button></div><p class="note">Las nuevas listas de Pokémon están cargadas en el orden que enviaste. El botón ES explica cómo escoger la pista de audio española en los vídeos que la ofrecen.</p></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const POKEMON=[{type:'ytlist',id:'PLRcHmntfmJ8B5eUO9b-J_fSWF5tPjnSWB',title:'Pokémon'},{type:'ytlist',id:'PLRcHmntfmJ8DU1LS6ExXHGTdzvpHDdVqn',title:'Pokémon'},{type:'ytlist',id:'PLRcHmntfmJ8AOHGOH7140F3UAntAqK6P9',title:'Pokémon'},{type:'ytlist',id:'PLarmIGx21XFw',video:'iPxSEVCvLLE',title:'Pokémon'}];
const OLD_IDS=new Set(['PLACWFlerZq-8V8x-Ist2boevsprDdOhFA','PLRcHmntfmJ8DB8wgMrUZwf3JGkLM17yeL','PLRcHmntfmJ8A7vV0RYnAu0farLTV_T1i2','PLRcHmntfmJ8BNWmL3MICuc1Oh5Mxf2qEh','PLRcHmntfmJ8AYULKvzhleQPgPRinNDpc0','PLRcHmntfmJ8BWeT4kzalbhx1r43bJv7pI','PLRcHmntfmJ8BdccTC3w86qIBdUjNDfPGV','PLRcHmntfmJ8DzeYoWwk7RsAbl2w-sg0zR','PLJCkfNkMHldU','initial_d_first_stage','PLFWMo_gjXR-P0YdtDG4NlIgEaC9tJaEwl']);
let items=[],idx=0,mode='none',yt=null,ytReady=false,ytLoading=false,ytQueue=[],muted=false,volume=1,osdTimer=null,embedTimer=null,randomStart=false,randomYTList=false;
const vid=$('vid'),ytbox=$('ytbox'),embedbox=$('embedbox');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('animetv3',JSON.stringify(items.filter(x=>x.type!=='file')))}catch(e){}}
function load(){try{const saved=JSON.parse(localStorage.getItem('animetv3')||'[]');if(Array.isArray(saved))items=saved.filter(x=>x&&x.type&&!OLD_IDS.has(x.id)&&x.type!=='embedlist')}catch(e){items=[]}for(const p of POKEMON){const old=items.find(x=>x.type==='ytlist'&&x.id===p.id);if(old){old.title='Pokémon';if(p.video)old.video=p.video}else items.push({...p})}save()}
function msg(t){$('osd').textContent=t;$('osd').classList.add('on');clearTimeout(osdTimer);osdTimer=setTimeout(()=>$('osd').classList.remove('on'),6000)}
function render(){$('list').innerHTML=items.map((x,i)=>'<li class="'+(i===idx?'now':'')+'" data-i="'+i+'"><span>'+(i+1)+'. '+esc(x.title||'Vídeo')+'</span><em>'+esc(x.type==='ytlist'||x.type==='yt'?'YouTube':x.type==='embed'?'incrustado':'vídeo')+'</em><button data-del="'+i+'" title="Quitar">✕</button></li>').join('')}
function setView(v){$('empty').style.display=v==='empty'?'grid':'none';vid.style.display=v==='video'?'block':'none';ytbox.style.display=v==='youtube'?'block':'none';embedbox.style.display=v==='embed'?'block':'none'}
function stopPlayers(){clearTimeout(embedTimer);try{vid.pause();vid.removeAttribute('src');vid.load();embedbox.src='about:blank'}catch(e){}if(ytReady){try{yt.stopVideo()}catch(e){}}}
function ensureYT(cb){if(ytReady){cb();return}ytQueue.push(cb);if(ytLoading)return;ytLoading=true;window.onYouTubeIframeAPIReady=()=>{try{yt=new YT.Player('ytplayer',{width:'100%',height:'100%',playerVars:{autoplay:1,controls:1,playsinline:1,rel:0,hl:'es'},events:{onReady:()=>{ytReady=true;ytLoading=false;try{yt.setVolume(volume*100);if(muted)yt.mute()}catch(e){}ytQueue.splice(0).forEach(f=>f())},onStateChange:e=>youtubeState(e.data),onError:e=>msg('YouTube no pudo reproducir este vídeo (error '+e.data+').')}})}catch(e){ytLoading=false;msg('No se pudo iniciar YouTube. Recarga la página.')}};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytLoading=false;ytQueue=[];msg('No se pudo cargar YouTube. Comprueba tu conexión.')};document.head.appendChild(s)}
function seekRandomYT(){if(!randomStart||!ytReady)return;try{const d=yt.getDuration();if(d>60){yt.seekTo(d*(.1+Math.random()*.5),true);randomStart=false}}catch(e){}}
function chooseRandomYT(){if(!randomYTList||!ytReady)return false;let ids=[];try{ids=yt.getPlaylist()||[]}catch(e){}if(!ids.length)return false;randomYTList=false;if(ids.length>1){let n=Math.floor(Math.random()*ids.length),c=yt.getPlaylistIndex();if(n!==c){yt.playVideoAt(n);return true}}return false}
function youtubeState(s){if(s===5&&randomYTList)chooseRandomYT();if(s===1){if(randomYTList&&chooseRandomYT())return;seekRandomYT()}if(s===0)youtubeEnded()}
function playItem(){if(!items.length){mode='none';setView('empty');render();return}const it=items[idx];stopPlayers();render();msg((idx+1)+'/'+items.length+' · '+it.title);if(it.type==='yt'||it.type==='ytlist'){mode='youtube';setView('youtube');randomYTList=randomStart&&it.type==='ytlist';ensureYT(()=>{try{if(it.type==='yt')yt.loadVideoById({videoId:it.id});else yt.loadPlaylist({list:it.id,listType:'playlist',index:0})}catch(e){msg('No se pudo cargar la lista de YouTube.')}});return}randomYTList=false;if(it.type==='embed'){mode='embed';setView('embed');embedbox.src=it.src;embedTimer=setTimeout(nextChannel,Math.max(1,Number(it.mins)||24)*60000);return}mode='video';setView('video');vid.src=it.src;vid.volume=volume;vid.muted=muted;vid.onloadedmetadata=()=>{if(randomStart&&vid.duration>60){vid.currentTime=vid.duration*(.1+Math.random()*.5);randomStart=false}};vid.play().catch(()=>msg('Pulsa Play dentro del reproductor.'))}
function youtubeEnded(){if(!ytReady)return;try{const p=yt.getPlaylist()||[],n=yt.getPlaylistIndex();if(p.length&&n>=0&&n<p.length-1)return}catch(e){}nextChannel()}
function nextChannel(){if(!items.length)return;randomStart=false;randomYTList=false;idx=(idx+1)%items.length;playItem()}
function previous(){if(!items.length)return;randomStart=false;randomYTList=false;if(mode==='youtube'&&ytReady){try{if(yt.getPlaylistIndex()>0){yt.previousVideo();return}}catch(e){}}idx=(idx-1+items.length)%items.length;playItem()}
function parseYT(v){let u;try{u=new URL(v)}catch(e){return null}const h=u.hostname.replace(/^(www|m)\./,''),id=h==='youtu.be'?u.pathname.slice(1).split('/')[0]:(h==='youtube.com'||h==='youtube-nocookie.com')?(u.searchParams.get('v')||(u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/)||[])[1]||''):'';const l=u.searchParams.get('list');if(l&&!l.startsWith('RD'))return{type:'ytlist',id:l,...(id?{video:id}:{})};return /^[\w-]{11}$/.test(id)?{type:'yt',id}:null}
function parseEmbed(v){const m=v.match(/<iframe[^>]+src=["']([^"']+)["']/i);if(m)v=m[1];let u;try{u=new URL(v)}catch(e){return null}if(!/^https?:$/.test(u.protocol))return null;const h=u.hostname.replace(/^www\./,''),x=u.pathname.match(/^\/video\/([\w-]+)/);if(h==='dailymotion.com'&&x)return'https://www.dailymotion.com/embed/video/'+x[1];const z=u.pathname.match(/^\/(\d+)/);if(h==='vimeo.com'&&z)return'https://player.vimeo.com/video/'+z[1];return /\/embed\b/.test(u.pathname)||h.startsWith('player.')?u.href:null}
$('list').onclick=e=>{const d=e.target.closest('[data-del]');if(d){const n=+d.dataset.del,cur=n===idx;items.splice(n,1);if(n<idx)idx--;if(idx>=items.length)idx=0;save();if(cur)playItem();else render();return}const r=e.target.closest('[data-i]');if(r){randomStart=false;randomYTList=false;idx=+r.dataset.i;playItem()}};
$('addUrl').onclick=()=>{const v=$('url').value.trim(),t=$('title').value.trim();if(!v)return;const y=parseYT(v);let it;if(y)it={...y,title:t||(y.type==='ytlist'?'Pokémon':'Vídeo de YouTube')};else{const emb=parseEmbed(v);if(emb)it={type:'embed',src:emb,mins:+$('mins').value||24,title:t||'Vídeo incrustado'};else if(/^https?:\/\//i.test(v))it={type:'video',src:v,title:t||decodeURIComponent(v.split('/').pop().split('?')[0]||'Vídeo')};else{alert('Enlace no válido.');return}}items.push(it);save();render();$('url').value='';$('title').value='';$('mins').value='';if(items.length===1){idx=0;playItem()}};
$('files').onchange=e=>{const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));for(const f of fs)items.push({type:'file',title:f.name.replace(/\.[^.]+$/,''),src:URL.createObjectURL(f)});render();if(fs.length&&items.length===fs.length){idx=0;playItem()}e.target.value=''};
$('powerBtn').onclick=()=>{$('power').style.display='none';if(!items.length){$('manage').classList.add('open');setView('empty');return}idx=Math.floor(Math.random()*items.length);randomStart=true;randomYTList=items[idx].type==='ytlist';playItem()};$('gear').onclick=()=>$('manage').classList.toggle('open');$('next').onclick=()=>{randomStart=false;randomYTList=false;if(mode==='youtube'&&ytReady){try{const p=yt.getPlaylist()||[];if(p.length&&yt.getPlaylistIndex()<p.length-1){yt.nextVideo();return}}catch(e){}}nextChannel()};$('prev').onclick=previous;
$('play').onclick=()=>{if(mode==='youtube'&&ytReady){try{yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo()}catch(e){}return}if(vid.src)vid.paused?vid.play().catch(()=>{}):vid.pause()};$('mute').onclick=()=>{muted=!muted;vid.muted=muted;if(ytReady)try{muted?yt.mute():yt.unMute()}catch(e){}$('mute').textContent=muted?'🔇':'🔊'};$('vol').oninput=e=>{volume=+e.target.value;vid.volume=volume;if(ytReady)try{yt.setVolume(volume*100)}catch(e){}};$('lang').onclick=()=>{if(mode!=='youtube'||!ytReady){msg('El botón ES funciona durante vídeos de YouTube.');return}msg('En el vídeo pulsa ⚙ → «Pista de audio» → «Español», si aparece.')};
$('clear').onclick=()=>{if(!confirm('¿Vaciar el canal?'))return;items=[];idx=0;save();stopPlayers();mode='none';setView('empty');render()};$('off').onclick=()=>{randomStart=false;randomYTList=false;stopPlayers();mode='none';setView('empty');$('power').style.display='grid'};$('full').onclick=()=>{const el=$('screen');if(document.fullscreenElement)document.exitFullscreen?.();else el.requestFullscreen?.().catch(()=>msg('Pantalla completa no disponible.'))};vid.addEventListener('ended',nextChannel);vid.addEventListener('error',()=>{if(mode==='video')msg('No se pudo reproducir el archivo.')});document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key===' '){e.preventDefault();$('play').click()}else if(e.key.toLowerCase()==='m')$('mute').click();else if(e.key.toLowerCase()==='f')$('full').click();else if(e.key.toLowerCase()==='l')$('lang').click()});
load();render();
</script>
</body>
</html>
